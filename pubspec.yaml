name: caixa_igreja
description: PDV local para eventos da igreja.
publish_to: 'none'

version: 1.6.0+8

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.29.0
  drift_flutter: ^0.2.7
  sqlite3_flutter_libs: ^0.5.40
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  intl: ^0.20.2
  google_fonts: ^6.2.1
  csv: ^6.0.0
  share_plus: ^11.0.0
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.3
  crypto: ^3.0.7
  file_picker: ^10.3.8
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  uuid: ^4.5.3
  blue_thermal_printer: ^1.2.3
  esc_pos_utils_plus: ^2.0.3
  package_info_plus: ^9.0.1
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.29.0
  build_runner: ^2.5.4
  flutter_launcher_icons: ^0.14.3
  # Teste de migração v8 -> v9 (cria um banco bruto no schema antigo)
  sqlite3: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
